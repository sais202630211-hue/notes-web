<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노트 웹</title>
  <link rel="stylesheet" href="all notes UI.css">
</head>
<body>
  <div class='frame_0_l frame_0'>
    <div class='frame_1_l frame_1'>
      <!-- 앱 타이틀 영역 -->
      <div class='frame_2_l frame_2'>
        <div class='frame_3_l frame_3'>
          <img src='메모장 아이콘/Icon.png' class='frame_4_l' />
          <span class='text_0_l text_0'>Notes</span>
        </div>
      </div>

      <!-- 상단 액션 버튼 영역 -->
      <div class="action-btn-container">
        <button id="newNoteBtn" type="button" class="primary-blue-btn">
          <span>+ New Note</span>
        </button>
        <button id="newFolderBtn" type="button" class="primary-blue-btn hidden">
          <span>+ New Folder</span>
        </button>
      </div>

      <!-- 메뉴 버튼 영역 -->
      <div class='frame_7_l frame_7' style="gap: 4px;">
        <button type="button" class='menu-btn' id="allNotesBtn">
          <img src='메모장 아이콘/All Notes(on).png' id="allNotesImg" />
          <span>All Notes</span>
        </button>

        <button type="button" class='menu-btn' id="quickNotesBtn">
          <img src='메모장 아이콘/Quick Notes(off).png' id="quickNotesImg" />
          <span>Quick Notes</span>
        </button>

        <button type="button" class='menu-btn' id="foldersBtn">
          <img src='메모장 아이콘/Folders(off).png' id="foldersImg" />
          <span>Folders</span>
        </button>

        <button type="button" class='menu-btn' id="trashBtn">
          <img src='메모장 아이콘/trash.png' id="trashImg" />
          <span>Trash</span>
        </button>
      </div>
    </div>

    <div class='frame_16_l frame_16'>
      <div class='frame_17_l frame_17'>
        <img src='도구 이미지/search.png' class='frame_18_l' />
        <input type="text" id="searchInput" class='text_6_l text_6' placeholder="Notes Search..." />
      </div>
      
      <!-- Folders 페이지 헤더 및 컨테이너 -->
      <div id="foldersHeader" class="folder-header-title" style="display: none;">All Folders</div>
      <div class='frame_19_l frame_19' id="noteList" style="flex: 1; overflow-y: auto;">
        <!-- 노트 목록 및 폴더 트리가 들어가는 영역 -->
      </div>

      <!-- Trash 전용 하단 액션 버튼 영역 -->
      <div id="trashActionArea" class="trash-action-area" style="display: none;">
        <button type="button" class="trash-btn-action" id="restoreNoteBtn">선택 노트 복원</button>
        <button type="button" class="trash-btn-action btn-empty-trash" id="emptyTrashBtn">휴지통 비우기</button>
      </div>
    </div>

    <!-- 오른쪽 메모 작성 영역 -->
    <div class='frame_21_l frame_21 empty-state' id="editorArea">
      <div class='frame_22_l frame_22'>
        <input type="text" class='text_10_l text_10' id="inputTitle" placeholder="제목을 입력하세요" />
        <span class='text_11_l text_11' id="lastModified">최종 수정일: 방금 전</span>
      </div>
      <div class='frame_23_l frame_23'>
        <div class='frame_24_l frame_24' id='btnBold' style='cursor:pointer;'><span class='tool'>B</span></div>
        <div class='frame_25_l frame_25' id='btnItalic' style='cursor:pointer;'><span class='tool'>I</span></div>
        <div class='frame_26_l frame_26' id='btnUnderline' style='cursor:pointer;'><span class='tool'>U</span></div>
        <img src='도구 이미지/strikethrough.png' class='frame_27_l' id='btnStrike' style='cursor:pointer;' />
        <img src='도구 이미지/list.png' class='frame_28_l' id='btnList' style='cursor:pointer;' />
        <img src='도구 이미지/hash.png' class='frame_29_l' id='btnHeading' style='cursor:pointer;' />
        <img src='도구 이미지/link.png' class='frame_31_l' id='btnLink' style='cursor:pointer;' />
      </div>
      <div class='frame_32_l frame_32'>
        <div class='frame_32_l frame_32'>
          <div id="inputContent" contenteditable="true" spellcheck="false" placeholder="내용을 입력하세요..."></div>
        </div>
      </div>
    </div>
  </div>

<script>
    const newNoteBtn = document.getElementById('newNoteBtn');
  const newFolderBtn = document.getElementById('newFolderBtn');

  const allNotesBtn = document.getElementById('allNotesBtn');
  const quickNotesBtn = document.getElementById('quickNotesBtn');
  const foldersBtn = document.getElementById('foldersBtn');
  const trashBtn = document.getElementById('trashBtn');

  const allNotesImg = document.getElementById('allNotesImg');
  const quickNotesImg = document.getElementById('quickNotesImg');
  const foldersImg = document.getElementById('foldersImg');
  const trashImg = document.getElementById('trashImg');

  const noteList = document.getElementById('noteList');
  const foldersHeader = document.getElementById('foldersHeader');
  const trashActionArea = document.getElementById('trashActionArea');

  const restoreNoteBtn = document.getElementById('restoreNoteBtn');
  const emptyTrashBtn = document.getElementById('emptyTrashBtn');

  const editorArea = document.getElementById('editorArea');
  const inputTitle = document.getElementById('inputTitle');
  const inputContent = document.getElementById('inputContent');
  const searchInput = document.getElementById('searchInput');
  const lastModified = document.getElementById('lastModified');

  const btnBold = document.getElementById('btnBold');
  const btnItalic = document.getElementById('btnItalic');
  const btnUnderline = document.getElementById('btnUnderline');
  const btnStrike = document.getElementById('btnStrike');
  const btnList = document.getElementById('btnList');
  const btnHeading = document.getElementById('btnHeading');
  const btnLink = document.getElementById('btnLink');

  /*
   * ============================================================
   * localStorage
   * ============================================================
   */

  const STORAGE_KEY = 'notesWebData';

  let notesData = {
    folders: [],
    notes: []
  };

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
  }

  function loadData() {
    const savedData = localStorage.getItem(STORAGE_KEY);

    if (!savedData) {
      notesData = {
        folders: [],
        notes: []
      };
      return;
    }

    try {
      notesData = JSON.parse(savedData);

      if (!Array.isArray(notesData.folders)) {
        notesData.folders = [];
      }

      if (!Array.isArray(notesData.notes)) {
        notesData.notes = [];
      }
    } catch (error) {
      console.error('저장된 데이터를 불러오는 중 오류:', error);

      notesData = {
        folders: [],
        notes: []
      };
    }
  }

  function generateId(prefix = 'item') {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
  }

  /*
   * ============================================================
   * 날짜 / 시간
   * ============================================================
   */

  function getFormattedDate(dateObj) {
    const year = dateObj.getFullYear();
    const month = dateObj.getMonth() + 1;
    const date = dateObj.getDate();

    let hours = dateObj.getHours();
    const minutes = String(dateObj.getMinutes()).padStart(2, '0');

    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12;
    hours = hours ? hours : 12;

    const formattedHours = String(hours).padStart(2, '0');

    return `${year}년 ${month}월 ${date}일 ${ampm} ${formattedHours}:${minutes}`;
  }

  function getElapsedTimeStr(updatedTimestamp) {
    if (!updatedTimestamp) return '방금 전';

    const now = Date.now();

    const diffInSeconds =
      Math.floor((now - Number(updatedTimestamp)) / 1000);

    if (diffInSeconds < 60) {
      return '방금 전';
    }

    const diffInMinutes = Math.floor(diffInSeconds / 60);

    if (diffInMinutes < 60) {
      return `${diffInMinutes}분 전`;
    }

    const diffInHours = Math.floor(diffInMinutes / 60);

    if (diffInHours < 24) {
      return `${diffInHours}시간 전`;
    }

    const diffInDays = Math.floor(diffInHours / 24);

    if (diffInDays < 30) {
      return `${diffInDays}일 전`;
    }

    const diffInMonths = Math.floor(diffInDays / 30);

    if (diffInMonths < 12) {
      return `${diffInMonths}달 전`;
    }

    const diffInYears = Math.floor(diffInDays / 365);

    return `${diffInYears}년 전`;
  }

  /*
   * ============================================================
   * 에디터 서식
   * ============================================================
   */

  function executeCommand(e, command, value = null) {
    if (e) {
      e.preventDefault();
    }

    if (!inputContent || currentCategory === 'trash') {
      return;
    }

    inputContent.focus();

    document.execCommand(command, false, value);

    inputContent.dispatchEvent(new Event('input', {
      bubbles: true
    }));
  }

  if (btnBold) {
    btnBold.addEventListener('mousedown', (e) => {
      executeCommand(e, 'bold');
    });
  }

  if (btnItalic) {
    btnItalic.addEventListener('mousedown', (e) => {
      executeCommand(e, 'italic');
    });
  }

  if (btnUnderline) {
    btnUnderline.addEventListener('mousedown', (e) => {
      executeCommand(e, 'underline');
    });
  }

  if (btnStrike) {
    btnStrike.addEventListener('mousedown', (e) => {
      executeCommand(e, 'strikeThrough');
    });
  }

  if (btnList) {
    btnList.addEventListener('mousedown', (e) => {
      executeCommand(e, 'insertUnorderedList');
    });
  }

  if (btnHeading) {
    btnHeading.addEventListener('mousedown', (e) => {
      executeCommand(e, 'formatBlock', '<h3>');
    });
  }

  function normalizeUrl(url) {
    if (!url) return '';

    const trimmed = url.trim();

    if (/^(https?:\/\/|file:\/\/|data:|\/|\.\/)/i.test(trimmed)) {
      return trimmed;
    }

    return 'https://' + trimmed;
  }

  if (btnLink) {
    btnLink.addEventListener('mousedown', (e) => {
      e.preventDefault();

      const inputUrl = prompt('연결할 링크 URL을 입력하세요:');

      if (!inputUrl || inputUrl.trim() === '') {
        return;
      }

      const finalUrl = normalizeUrl(inputUrl);

      const selection = window.getSelection();

      if (!selection || selection.isCollapsed) {
        executeCommand(
          null,
          'insertHTML',
          `<a href="${finalUrl}" target="_blank" rel="noopener noreferrer">${finalUrl}</a>`
        );
      } else {
        executeCommand(null, 'createLink', finalUrl);

        const anchor =
          selection.anchorNode?.parentElement?.closest('a');

        if (anchor) {
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
        }
      }
    });
  }

  if (inputContent) {
    inputContent.addEventListener('click', (e) => {
      const link = e.target.closest('a');

      if (link && link.href) {
        e.preventDefault();

        window.open(
          link.href,
          '_blank',
          'noopener,noreferrer'
        );
      }
    });
  }

  /*
   * ============================================================
   * 현재 상태
   * ============================================================
   */

  let activeNote = null;
  let activeFolder = null;
  let currentCategory = 'all';

  /*
   * ============================================================
   * 카드 시간 갱신
   * ============================================================
   */

  function refreshAllNoteTimes() {
    const noteCards = noteList.querySelectorAll('.frame_20');

    noteCards.forEach(card => {
      const timeSpan = card.querySelector('.card-time');

      if (timeSpan && timeSpan.dataset.updatedAt) {
        timeSpan.textContent =
          getElapsedTimeStr(timeSpan.dataset.updatedAt);
      }
    });
  }

  function updateTimestamp() {
    if (!activeNote) {
      return;
    }

    const nowTimestamp = Date.now();

    const noteId = activeNote.dataset.id;

    const note = notesData.notes.find(
      item => item.id === noteId
    );

    if (note) {
      note.updatedAt = nowTimestamp;
    }

    const timeSpan = activeNote.querySelector('.card-time');

    if (timeSpan) {
      timeSpan.dataset.updatedAt = nowTimestamp;
      timeSpan.textContent = '방금 전';
    }

    if (lastModified) {
      lastModified.textContent =
        `최종 수정일: ${getFormattedDate(new Date(nowTimestamp))}`;
    }

    saveData();

    refreshAllNoteTimes();
  }

  /*
   * ============================================================
   * 읽기 전용 상태
   * ============================================================
   */

  function updateEditorReadOnlyState() {
    const isTrash =
      currentCategory === 'trash' ||
      (activeNote && activeNote.dataset.category === 'trash');

    if (isTrash) {
      inputTitle.setAttribute('readonly', 'true');
      inputContent.setAttribute('contenteditable', 'false');
    } else {
      inputTitle.removeAttribute('readonly');
      inputContent.setAttribute('contenteditable', 'true');
    }
  }

  /*
   * ============================================================
   * 폴더 생성
   * ============================================================
   */

  function createFolder() {
    if (currentCategory === 'trash') {
      alert('휴지통에서는 폴더를 생성할 수 없습니다.');
      return;
    }

    const folderId = generateId('folder');

    const folder = {
      id: folderId,
      name: '새 폴더',
      parentId: activeFolder
        ? activeFolder.dataset.id
        : null,
      collapsed: false,
      trashed: false,
      createdAt: Date.now()
    };

    notesData.folders.push(folder);

    saveData();

    renderAll();

    const folderElement =
      document.querySelector(
        `.folder-item[data-id="${folderId}"]`
      );

    if (folderElement) {
      selectFolder(folderElement);
    }
  }

  /*
   * ============================================================
   * 폴더 렌더링
   * ============================================================
   */

  function createFolderElement(folder) {
    const wrapper = document.createElement('div');

    wrapper.className = 'folder-wrapper';

    wrapper.dataset.id = folder.id;

    if (folder.trashed) {
      wrapper.dataset.folderTrash = 'true';
    }

    const folderItem = document.createElement('div');

    folderItem.className = 'folder-item';

    folderItem.dataset.id = folder.id;

    const childrenContainer = document.createElement('div');

    childrenContainer.className = 'folder-children';

    if (folder.collapsed) {
      childrenContainer.classList.add('collapsed');
    }

    folderItem.innerHTML = `
      <div class="folder-left">
        <span class="arrow-icon">
          ${folder.collapsed ? '▶' : '▼'}
        </span>

        <span class="folder-icon">📁</span>

        <span
          class="folder-title"
          contenteditable="true"
          spellcheck="false"
        ></span>
      </div>

      <span class="folder-count-badge">0</span>
    `;

    const folderTitle =
      folderItem.querySelector('.folder-title');

    folderTitle.textContent = folder.name;

    wrapper.appendChild(folderItem);
    wrapper.appendChild(childrenContainer);

    /*
     * 폴더 열기 / 닫기
     */
    const arrowIcon =
      folderItem.querySelector('.arrow-icon');

    arrowIcon.addEventListener('click', (e) => {
      e.stopPropagation();

      folder.collapsed = !folder.collapsed;

      childrenContainer.classList.toggle(
        'collapsed',
        folder.collapsed
      );

      arrowIcon.textContent =
        folder.collapsed ? '▶' : '▼';

      saveData();
    });

    /*
     * 폴더 제목 수정
     */
    folderTitle.addEventListener('click', (e) => {
      e.stopPropagation();

      selectFolder(folderItem);
    });

    folderTitle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();

        folderTitle.blur();
      }
    });

    folderTitle.addEventListener('blur', () => {
      const newName =
        folderTitle.textContent.trim();

      folder.name =
        newName === '' ? '새 폴더' : newName;

      folderTitle.textContent = folder.name;

      saveData();
    });

    /*
     * 폴더 선택
     */
    folderItem.addEventListener('click', (e) => {
      e.stopPropagation();

      selectFolder(folderItem);
    });

    return wrapper;
  }

  /*
   * ============================================================
   * 노트 생성
   * ============================================================
   */

  function createNewNote() {
    if (currentCategory === 'trash') {
      alert('휴지통에서는 새 메모를 생성할 수 없습니다.');
      return;
    }

    if (currentCategory === 'folders' && !activeFolder) {
      alert('노트를 생성할 폴더를 먼저 선택해주세요.');
      return;
    }

    const noteId = generateId('note');

    const now = Date.now();

    let folderId = null;

    if (activeFolder) {
      folderId = activeFolder.dataset.id;
    }

    const note = {
      id: noteId,
      title: '',
      content: '',
      folderId: folderId,
      category: folderId ? 'folder' : currentCategory,
      trashed: false,
      updatedAt: now,
      createdAt: now
    };

    notesData.notes.unshift(note);

    saveData();

    renderAll();

    const noteElement =
      document.querySelector(
        `.frame_20[data-id="${noteId}"]`
      );

    if (noteElement) {
      selectNote(noteElement);
    }
  }

  /*
   * ============================================================
   * 노트 DOM 생성
   * ============================================================
   */

  function createNoteElement(note) {
    const noteCard = document.createElement('div');

    noteCard.className =
      'frame_20_l frame_20';

    noteCard.style.cursor = 'pointer';

    noteCard.dataset.id = note.id;

    noteCard.dataset.category =
      note.trashed ? 'trash' : note.category;

    noteCard.innerHTML = `
      <span class="text_7_l text_7 card-title">
      </span>

      <span class="text_8_l card-content">
      </span>

      <span
        class="text_8_l card-time"
        data-updated-at="${note.updatedAt}"
      >
      </span>
    `;

    const titleSpan =
      noteCard.querySelector('.card-title');

    const contentSpan =
      noteCard.querySelector('.card-content');

    const timeSpan =
      noteCard.querySelector('.card-time');

    titleSpan.dataset.fullTitle =
      note.title || '';

    contentSpan.dataset.fullContent =
      note.content || '';

    renderNoteTitle(
      titleSpan,
      note.title || '',
      false
    );

    updateContentPreview(
      contentSpan,
      note.content || ''
    );

    timeSpan.textContent =
      getElapsedTimeStr(note.updatedAt);

    noteCard.addEventListener('click', (e) => {
      e.stopPropagation();

      selectNote(noteCard);
    });

    return noteCard;
  }

  function updateContentPreview(
    contentSpan,
    value
  ) {
    if (!value || value.trim() === '') {
      contentSpan.textContent = '내용 없음';
      return;
    }

    /*
     * HTML 태그를 제거한 미리보기
     */
    const tempDiv =
      document.createElement('div');

    tempDiv.innerHTML = value;

    const plainText =
      tempDiv.textContent ||
      tempDiv.innerText ||
      '';

    if (plainText.length > 20) {
      contentSpan.textContent =
        plainText.slice(0, 20) + '...';
    } else {
      contentSpan.textContent = plainText;
    }
  }

  /*
   * ============================================================
   * 전체 렌더링
   * ============================================================
   */

  function renderAll() {
    noteList.innerHTML = '';

    /*
     * 최상위 폴더부터 렌더링
     */
    const rootFolders =
      notesData.folders.filter(
        folder => folder.parentId === null
      );

    rootFolders.forEach(folder => {
      const wrapper =
        createFolderTree(folder);

      noteList.appendChild(wrapper);
    });

    /*
     * 폴더에 속하지 않는 노트
     */
    const rootNotes =
      notesData.notes.filter(
        note => !note.folderId
      );

    rootNotes.forEach(note => {
      noteList.appendChild(
        createNoteElement(note)
      );
    });

    updateFolderCounts();

    filterNotes(
      searchInput ? searchInput.value : ''
    );
  }

  /*
   * ============================================================
   * 폴더 트리 생성
   * ============================================================
   */

  function createFolderTree(folder) {
    const wrapper =
      createFolderElement(folder);

    const childrenContainer =
      wrapper.querySelector('.folder-children');

    /*
     * 이 폴더 안의 노트
     */
    const folderNotes =
      notesData.notes.filter(
        note => note.folderId === folder.id
      );

    folderNotes.forEach(note => {
      childrenContainer.appendChild(
        createNoteElement(note)
      );
    });

    /*
     * 하위 폴더
     */
    const childFolders =
      notesData.folders.filter(
        child =>
          child.parentId === folder.id
      );

    childFolders.forEach(childFolder => {
      childrenContainer.appendChild(
        createFolderTree(childFolder)
      );
    });

    return wrapper;
  }

  /*
   * ============================================================
   * 폴더 선택
   * ============================================================
   */

  function selectFolder(folderItem) {
    if (activeFolder === folderItem) {
      deselectFolder();
      return;
    }

    deselectNote();
    deselectFolder();

    activeFolder = folderItem;

    activeFolder.classList.add('selected');

    editorArea.classList.add('empty-state');
  }

  function deselectFolder() {
    document
      .querySelectorAll('.folder-item')
      .forEach(item => {
        item.classList.remove('selected');
      });

    activeFolder = null;

    if (!activeNote) {
      editorArea.classList.add('empty-state');
    }
  }

  /*
   * ============================================================
   * 폴더 내 노트 개수
   * ============================================================
   */

  function updateFolderCounts() {
    const wrappers =
      document.querySelectorAll('.folder-wrapper');

    wrappers.forEach(wrapper => {
      const folderId =
        wrapper.dataset.id;

      const badge =
        wrapper.querySelector(
          '.folder-count-badge'
        );

      if (!badge) return;

      const count =
        notesData.notes.filter(note =>
          note.folderId === folderId &&
          !note.trashed
        ).length;

      badge.textContent = count;
    });
  }

  /*
   * ============================================================
   * 노트 선택
   * ============================================================
   */

  function selectNote(noteCard) {
    if (activeNote === noteCard) {
      deselectNote();
      return;
    }

    deselectFolder();
    deselectNote();

    activeNote = noteCard;

    activeNote.classList.add('selected');

    editorArea.classList.remove('empty-state');

    const noteId =
      noteCard.dataset.id;

    const note =
      notesData.notes.find(
        item => item.id === noteId
      );

    if (!note) return;

    const titleSpan =
      noteCard.querySelector('.card-title');

    renderNoteTitle(
      titleSpan,
      note.title || '',
      true
    );

    inputTitle.value =
      note.title || '';

    /*
     * contenteditable은 value가 아니라 innerHTML
     */
    inputContent.innerHTML =
      note.content || '';

    if (lastModified) {
      lastModified.textContent =
        `최종 수정일: ${getFormattedDate(
          new Date(note.updatedAt)
        )}`;
    }

    updateEditorReadOnlyState();
  }

  /*
   * ============================================================
   * 노트 선택 해제
   * ============================================================
   */

  function deselectNote() {
    if (activeNote) {
      const titleSpan =
        activeNote.querySelector('.card-title');

      const note =
        notesData.notes.find(
          item => item.id === activeNote.dataset.id
        );

      renderNoteTitle(
        titleSpan,
        note ? note.title : '',
        false
      );
    }

    document
      .querySelectorAll('.frame_20')
      .forEach(card => {
        card.classList.remove('selected');
      });

    activeNote = null;

    if (!activeFolder) {
      editorArea.classList.add('empty-state');
    }

    inputTitle.value = '';

    inputContent.innerHTML = '';

    if (lastModified) {
      lastModified.textContent =
        '최종 수정일: 없음';
    }

    updateEditorReadOnlyState();
  }

  /*
   * ============================================================
   * 제목 표시
   * ============================================================
   */

  function renderNoteTitle(
    titleSpan,
    rawTitle,
    isSelected
  ) {
    let displayTitle =
      (rawTitle || '').trim();

    if (displayTitle === '') {
      displayTitle = '제목 없음';
    } else if (displayTitle.length > 20) {
      displayTitle =
        displayTitle.slice(0, 20) + '...';
    }

    titleSpan.textContent =
      isSelected
        ? `${displayTitle} ◀`
        : displayTitle;
  }

  /*
   * ============================================================
   * 제목 입력 저장
   * ============================================================
   */

  inputTitle.addEventListener('input', (e) => {
    if (!activeNote) return;

    if (currentCategory === 'trash') {
      return;
    }

    const note =
      notesData.notes.find(
        item => item.id === activeNote.dataset.id
      );

    if (!note) return;

    const value =
      e.target.value;

    note.title = value;

    const titleSpan =
      activeNote.querySelector('.card-title');

    titleSpan.dataset.fullTitle =
      value;

    renderNoteTitle(
      titleSpan,
      value,
      true
    );

    updateTimestamp();
  });

  /*
   * ============================================================
   * 내용 입력 저장
   * ============================================================
   */

  inputContent.addEventListener('input', () => {
    if (!activeNote) return;

    if (currentCategory === 'trash') {
      return;
    }

    const note =
      notesData.notes.find(
        item => item.id === activeNote.dataset.id
      );

    if (!note) return;

    /*
     * HTML 형식 그대로 저장
     *
     * 예:
     * <b>굵은 글씨</b>
     * <h3>제목</h3>
     * <ul><li>목록</li></ul>
     */
    note.content =
      inputContent.innerHTML;

    const contentSpan =
      activeNote.querySelector('.card-content');

    contentSpan.dataset.fullContent =
      note.content;

    updateContentPreview(
      contentSpan,
      note.content
    );

    updateTimestamp();
  });

  /*
   * ============================================================
   * 검색 / 필터
   * ============================================================
   */

  function filterNotes(keyword = '') {
    const query =
      keyword.toLowerCase().trim();

    const noteCards =
      noteList.querySelectorAll('.frame_20');

    const folderWrappers =
      noteList.querySelectorAll(
        '.folder-wrapper'
      );

    /*
     * Folders
     */
    if (currentCategory === 'folders') {
      newFolderBtn.classList.remove('hidden');

      foldersHeader.style.display = 'block';

      trashActionArea.style.display = 'none';

      searchInput.placeholder =
        'Folders Search...';

      folderWrappers.forEach(wrapper => {
        const folderId =
          wrapper.dataset.id;

        const folder =
          notesData.folders.find(
            item => item.id === folderId
          );

        if (!folder || folder.trashed) {
          wrapper.style.display = 'none';
          return;
        }

        const matches =
          folder.name
            .toLowerCase()
            .includes(query);

        wrapper.style.display =
          matches ? 'block' : 'none';
      });

      noteCards.forEach(card => {
        const note =
          notesData.notes.find(
            item => item.id === card.dataset.id
          );

        if (!note) return;

        if (note.folderId) {
          card.style.display =
            note.trashed ? 'none' : 'flex';
        } else {
          card.style.display = 'none';
        }
      });

      return;
    }

    newFolderBtn.classList.add('hidden');

    foldersHeader.style.display = 'none';

    /*
     * Trash
     */
    if (currentCategory === 'trash') {
      trashActionArea.style.display = 'flex';

      searchInput.placeholder =
        'Trash Search...';

      folderWrappers.forEach(wrapper => {
        const folderId =
          wrapper.dataset.id;

        const folder =
          notesData.folders.find(
            item => item.id === folderId
          );

        if (folder && folder.trashed) {
          wrapper.style.display = 'block';

          const folderItem =
            wrapper.querySelector('.folder-item');

          if (folderItem) {
            folderItem.style.display = 'flex';
          }
        } else {
          wrapper.style.display = 'contents';

          const folderItem =
            wrapper.querySelector('.folder-item');

          if (folderItem) {
            folderItem.style.display = 'none';
          }
        }
      });
    } else {
      trashActionArea.style.display = 'none';

      searchInput.placeholder =
        'Notes Search...';

      folderWrappers.forEach(wrapper => {
        wrapper.style.display = 'none';
      });
    }

    /*
     * 노트 필터
     */
    noteCards.forEach(card => {
      const note =
        notesData.notes.find(
          item => item.id === card.dataset.id
        );

      if (!note) return;

      const title =
        (note.title || '').toLowerCase();

      const content =
        (note.content || '')
          .replace(/<[^>]*>/g, '')
          .toLowerCase();

      const matchesQuery =
        query === '' ||
        title.includes(query) ||
        content.includes(query);

      let matchesCategory = false;

      if (currentCategory === 'all') {
        matchesCategory =
          !note.trashed &&
          !note.folderId;
      } else if (currentCategory === 'quick') {
        matchesCategory =
          !note.trashed &&
          note.category === 'quick';
      } else if (currentCategory === 'trash') {
        matchesCategory =
          note.trashed;
      }

      card.style.display =
        matchesCategory && matchesQuery
          ? 'flex'
          : 'none';
    });
  }

  /*
   * ============================================================
   * 메뉴 아이콘
   * ============================================================
   */

  function updateMenuIcons(selected) {
    allNotesImg.src =
      selected === 'all'
        ? '메모장 아이콘/All Notes(on).png'
        : '메모장 아이콘/All Notes(off).png';

    quickNotesImg.src =
      selected === 'quick'
        ? '메모장 아이콘/Quick Notes(on).png'
        : '메모장 아이콘/Quick Notes(off).png';

    foldersImg.src =
      selected === 'folders'
        ? '메모장 아이콘/Folders(on).png'
        : '메모장 아이콘/Folders(off).png';

    if (selected === 'trash') {
      trashImg.classList.add('icon-blue');
    } else {
      trashImg.classList.remove('icon-blue');
    }

    updateEditorReadOnlyState();
  }

  /*
   * ============================================================
   * All Notes
   * ============================================================
   */

  allNotesBtn.addEventListener('click', () => {
    currentCategory = 'all';

    updateMenuIcons('all');

    searchInput.value = '';

    deselectNote();
    deselectFolder();

    filterNotes('');
  });

  /*
   * ============================================================
   * Quick Notes
   * ============================================================
   */

  quickNotesBtn.addEventListener('click', () => {
    currentCategory = 'quick';

    updateMenuIcons('quick');

    searchInput.value = '';

    deselectNote();
    deselectFolder();

    filterNotes('');
  });

  /*
   * ============================================================
   * Folders
   * ============================================================
   */

  foldersBtn.addEventListener('click', () => {
    currentCategory = 'folders';

    updateMenuIcons('folders');

    searchInput.value = '';

    deselectNote();
    deselectFolder();

    filterNotes('');
  });

  /*
   * ============================================================
   * Trash
   * ============================================================
   */

  trashBtn.addEventListener('click', () => {
    /*
     * 선택된 노트 → 휴지통
     */
    if (
      activeNote &&
      currentCategory !== 'trash'
    ) {
      const note =
        notesData.notes.find(
          item => item.id === activeNote.dataset.id
        );

      if (note) {
        note.trashed = true;
        note.category = 'trash';
      }

      saveData();

      deselectNote();

      renderAll();

      currentCategory = 'trash';

      updateMenuIcons('trash');

      filterNotes('');
      return;
    }

    /*
     * 선택된 폴더 → 휴지통
     */
    if (
      activeFolder &&
      currentCategory === 'folders'
    ) {
      const folderId =
        activeFolder.dataset.id;

      const folder =
        notesData.folders.find(
          item => item.id === folderId
        );

      if (folder) {
        folder.trashed = true;
      }

      /*
       * 폴더 안의 모든 노트도 휴지통
       */
      notesData.notes.forEach(note => {
        if (note.folderId === folderId) {
          note.trashed = true;
          note.category = 'trash';
        }
      });

      saveData();

      deselectFolder();

      renderAll();

      currentCategory = 'trash';

      updateMenuIcons('trash');

      filterNotes('');
      return;
    }

    /*
     * 아무것도 선택하지 않았으면
     * 휴지통 페이지로 이동
     */
    currentCategory = 'trash';

    updateMenuIcons('trash');

    searchInput.value = '';

    deselectNote();
    deselectFolder();

    filterNotes('');
  });

  /*
   * ============================================================
   * 복원
   * ============================================================
   */

  restoreNoteBtn.addEventListener('click', () => {
    /*
     * 노트 복원
     */
    if (
      activeNote &&
      activeNote.dataset.category === 'trash'
    ) {
      const note =
        notesData.notes.find(
          item => item.id === activeNote.dataset.id
        );

      if (note) {
        note.trashed = false;

        /*
         * 폴더에 속해 있으면 folder,
         * 아니면 all
         */
        note.category =
          note.folderId
            ? 'folder'
            : 'all';
      }

      saveData();

      deselectNote();

      renderAll();

      filterNotes(
        searchInput.value
      );

      return;
    }

    /*
     * 폴더 복원
     */
    if (activeFolder) {
      const folderId =
        activeFolder.dataset.id;

      const folder =
        notesData.folders.find(
          item => item.id === folderId
        );

      if (
        folder &&
        folder.trashed
      ) {
        folder.trashed = false;

        notesData.notes.forEach(note => {
          if (note.folderId === folderId) {
            note.trashed = false;

            note.category = 'folder';
          }
        });

        saveData();

        deselectFolder();

        renderAll();

        filterNotes(
          searchInput.value
        );
      }
    }
  });

  /*
   * ============================================================
   * 휴지통 비우기
   * ============================================================
   */

  emptyTrashBtn.addEventListener('click', () => {
    const trashNotes =
      notesData.notes.filter(
        note => note.trashed
      );

    const trashFolders =
      notesData.folders.filter(
        folder => folder.trashed
      );

    if (
      trashNotes.length === 0 &&
      trashFolders.length === 0
    ) {
      alert('휴지통이 비어있습니다.');
      return;
    }

    const confirmed =
      confirm(
        '휴지통에 있는 모든 항목을 영구 삭제하시겠습니까? 복원할 수 없습니다.'
      );

    if (!confirmed) {
      return;
    }

    /*
     * 휴지통 노트 삭제
     */
    notesData.notes =
      notesData.notes.filter(
        note => !note.trashed
      );

    /*
     * 휴지통 폴더 삭제
     */
    const deletedFolderIds =
      notesData.folders
        .filter(folder => folder.trashed)
        .map(folder => folder.id);

    notesData.folders =
      notesData.folders.filter(
        folder => !folder.trashed
      );

    /*
     * 삭제된 폴더에 속했던 노트도 삭제
     */
    notesData.notes =
      notesData.notes.filter(
        note =>
          !deletedFolderIds.includes(
            note.folderId
          )
      );

    saveData();

    deselectNote();
    deselectFolder();

    renderAll();

    filterNotes(
      searchInput.value
    );
  });

  /*
   * ============================================================
   * 검색
   * ============================================================
   */

  searchInput.addEventListener(
    'input',
    (e) => {
      filterNotes(e.target.value);
    }
  );

  /*
   * ============================================================
   * 버튼
   * ============================================================
   */

  newNoteBtn.addEventListener(
    'click',
    createNewNote
  );

  newFolderBtn.addEventListener(
    'click',
    createFolder
  );

  /*
   * ============================================================
   * 빈 공간 클릭
   * ============================================================
   */

  noteList.addEventListener('click', (e) => {
    if (e.target === noteList) {
      deselectNote();
      deselectFolder();
    }
  });

  /*
   * ============================================================
   * 초기화
   * ============================================================
   */

  loadData();

  renderAll();

  deselectNote();
  deselectFolder();

  currentCategory = 'all';

  updateMenuIcons('all');

  filterNotes('');

  /*
   * 10초마다 시간 표시 갱신
   */
  setInterval(
    refreshAllNoteTimes,
    10000
  );
</script>
</body>
</html>
